<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://50th-m-et-mme-bconcep.vercel.app/">

  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="You Are Invited — 50th Birthday">
  <meta name="twitter:description" content="Open the envelope to reveal the invitation.">
  <meta name="twitter:image" content="https://50th-m-et-mme-bconcep.vercel.app/whatsapp-envelope-preview.jpg">
  <title>You Are Invited — 50th Birthday</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Playfair+Display:wght@600;700;900&display=swap" rel="stylesheet">
  <style>
    /* ---------- reset & root ---------- */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Cormorant Garamond', serif;
      background: radial-gradient(1100px 700px at 50% 18%, #45515f 0%, #323b45 45%, #14171b 100%);
      color: #f8f3e6;
      overflow-x: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* ---------- background bubbles (champagne) ---------- */
    .bubble-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .bubble {
      position: absolute;
      bottom: -60px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(233, 210, 138, 0.2), rgba(201, 162, 39, 0.06));
      border: 1px solid rgba(233, 210, 138, 0.12);
      box-shadow: inset 0 0 12px rgba(233, 210, 138, 0.05), 0 0 18px rgba(233, 210, 138, 0.02);
      animation: rise linear infinite;
      backdrop-filter: blur(1px);
    }
    .bubble::after {
      content: '';
      position: absolute;
      top: 12%;
      left: 18%;
      width: 20%;
      height: 20%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.25), transparent 70%);
    }
    @keyframes rise {
      0% {
        transform: translateY(0) translateX(0) scale(0.8) rotate(0deg);
        opacity: 0.3;
      }
      20% { opacity: 0.7; }
      80% { opacity: 0.5; }
      100% {
        transform: translateY(-110vh) translateX(40px) scale(1.3) rotate(720deg);
        opacity: 0;
      }
    }

    /* ---------- bg twinkles (keep for depth) ---------- */
    .bg-flecks {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .bg-flecks span {
      position: absolute;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: #e9d28a;
      opacity: 0;
      filter: blur(0.5px);
      box-shadow: 0 0 6px 1px rgba(233, 210, 138, 0.3);
      animation: twinkle 5s ease-in-out infinite;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0; transform: scale(0.5); }
      50% { opacity: 0.5; transform: scale(1); }
    }

    /* ---------- stage ---------- */
    .stage {
      position: relative;
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6vh 5vw;
      z-index: 1;
    }

    :root{
  --navy:#16294a;
  --navy-d:#0b1830;
  --gold:#c9a24c;
  --muted:#6f695d;
  --ease-luxury:cubic-bezier(.22,1,.36,1);
}

/* ═══ ENVELOPE (from v3) ═══ */
        #env {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background:
                radial-gradient(circle at 50% 34%, rgba(255, 255, 255, .9), transparent 34%),
                radial-gradient(circle at 50% 115%, rgba(122, 92, 31, .22), transparent 45%),
                repeating-linear-gradient(30deg, rgba(110, 76, 22, .018) 0 1px, transparent 1px 5px),
                linear-gradient(135deg, #fcf8ee, #ebdaba 56%, #f8f0df);
            transition: opacity 1.15s var(--ease-luxury), transform 1.15s var(--ease-luxury);
        }
        #env.opening {
            pointer-events: none
        }
        #env.opened {
            opacity: 0;
            transform: translateY(-100%);
            pointer-events: none
        }
        .env-wrap {
            position: relative;
            width: min(380px, 88vw);
            cursor: pointer;
            user-select: none;
            z-index: 2;
            transition: transform .7s var(--ease-luxury)
        }
        .env-wrap:hover {
            transform: translateY(-6px) scale(1.015)
        }
        .env-wrap:active {
            transform: scale(.985)
        }
        .env-wrap:focus-visible {
            outline: 2px solid var(--gold);
            outline-offset: 8px;
            border-radius: 6px
        }
        .env-body {
            width: 100%;
            padding-bottom: 65%;
            position: relative;
            border-radius: 3px 3px 10px 10px;
            overflow: hidden;
            background:
                radial-gradient(circle at 22% 18%, rgba(255, 255, 255, .4), transparent 38%),
                repeating-linear-gradient(112deg, rgba(110, 76, 22, .022) 0 1px, transparent 1px 5px),
                linear-gradient(145deg, #f5edda, #faf5e6 45%, #ebddbc);
            box-shadow: 0 1px 0 rgba(255, 255, 255, .85) inset, 0 30px 70px rgba(8, 19, 36, .28), 0 8px 20px rgba(122, 92, 31, .20), 0 48px 90px -30px rgba(8, 19, 36, .5);
        }
        .env-body::before {
            content: '';
            position: absolute;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            /* Clean envelope surface: no dark X/cross fold marks. */
            background: linear-gradient(180deg, transparent 58%, rgba(122, 92, 31, .09) 100%);
        }
        .env-flap {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: calc(min(380px, 88vw) * .36);
            z-index: 12;
            transform-origin: top center;
            backface-visibility: hidden;
            transition: transform .9s var(--ease-luxury);
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            background:
                radial-gradient(circle at 18% 10%, rgba(255, 255, 255, .5), transparent 45%),
                repeating-linear-gradient(30deg, rgba(122, 92, 31, .025) 0 1px, transparent 1px 5px),
                linear-gradient(180deg, #f0e3c2, #e2cfa0);
            filter: drop-shadow(0 5px 7px rgba(8, 19, 36, .18));
        }
        .env-flap::before {
            content: '';
            position: absolute;
            inset: 0;
            clip-path: inherit;
            pointer-events: none;
            background: linear-gradient(210deg, rgba(122, 92, 31, .16), transparent 42%)
        }
        .env-flap::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 34px;
            pointer-events: none;
            background: linear-gradient(180deg, rgba(255, 255, 255, .55), rgba(255, 255, 255, 0))
        }
        .env-flap.open {
            transform: rotateX(180deg)
        }
        .env-inner {
            position: absolute;
            inset: 21% 9% 4%;
            background:
                radial-gradient(circle at 50% 0%, rgba(255, 255, 255, .9), transparent 55%),
                linear-gradient(160deg, #fffef9, #f4ead2);
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 -6px 18px rgba(8, 19, 36, .12), 0 2px 6px rgba(122, 92, 31, .08) inset;
            transition: transform .85s var(--ease-luxury) .35s;
            overflow: hidden;
        }
        .env-inner.rising {
            transform: translateY(-64px)
        }
        .env-inner-content {
            text-align: center;
            padding: 20px
        }
        .env-inner-content .num {
            font-size: clamp(2.6rem, 7vw, 3.6rem);
            font-weight: 600;
            line-height: 1;
            display: block;
            background: linear-gradient(110deg, #8f6b23, #e8cd8f 45%, #a88333 70%, #f0dca6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 2px 6px rgba(122, 92, 31, .18));
        }
        .env-inner-content .tag {
            font-family: 'Montserrat', sans-serif;
            font-size: .58rem;
            letter-spacing: .36em;
            color: var(--navy);
            text-transform: uppercase;
            margin-top: .55rem;
            display: block
        }
        .env-seal {
            position: absolute;
            bottom: -26px;
            left: 50%;
            transform: translateX(-50%);
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 30;
            color: #fdf6e3;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            font-size: .95rem;
            text-shadow: 0 1px 1px rgba(74, 50, 10, .4);
            background:
                radial-gradient(circle at 32% 26%, rgba(255, 255, 255, .42), transparent 52%),
                radial-gradient(circle at 62% 78%, rgba(122, 92, 31, .55), transparent 62%),
                linear-gradient(135deg, #e0c276, #a07e34 55%, #7c5f22);
            border: 1.5px solid rgba(133, 96, 29, .55);
            box-shadow: 0 10px 22px rgba(8, 19, 36, .4), 0 4px 10px rgba(122, 92, 31, .28), inset 0 2px 2px rgba(255, 255, 255, .6), inset 0 -4px 8px rgba(74, 50, 10, .55);
            animation: sealBreath 3s ease-in-out infinite;
            transition: transform .5s var(--ease-luxury), opacity .5s ease;
        }
        .env-seal::after {
            content: '';
            position: absolute;
            inset: 4px;
            border-radius: 50%;
            border: 1px solid rgba(255, 240, 200, .28);
            pointer-events: none
        }
        .env-seal.hidden {
            opacity: 0;
            transform: translateX(-50%) scale(.4)
        }
        @keyframes sealBreath {
            0%,
            100% {
                box-shadow: 0 10px 22px rgba(8, 19, 36, .4), 0 4px 10px rgba(122, 92, 31, .28), inset 0 2px 2px rgba(255, 255, 255, .6), inset 0 -4px 8px rgba(74, 50, 10, .55)
            }
            50% {
                box-shadow: 0 13px 30px rgba(8, 19, 36, .48), 0 0 26px rgba(201, 162, 76, .3), 0 4px 10px rgba(122, 92, 31, .28), inset 0 2px 2px rgba(255, 255, 255, .65), inset 0 -4px 8px rgba(74, 50, 10, .55)
            }
        }
        .env-hint {
            text-align: center;
            margin-top: 44px;
            color: var(--muted);
            font-style: italic;
            font-size: .98rem;
            letter-spacing: .06em;
            text-shadow: 0 1px 0 rgba(255, 255, 255, .7);
            position: relative;
            z-index: 2;
            transition: opacity .5s ease, transform .5s var(--ease-luxury);
            animation: pulseHint 2.2s ease-in-out infinite;
        }
        @keyframes pulseHint {
            0%,
            100% {
                opacity: .45
            }
            50% {
                opacity: 1
            }
        }

        

    #envelope-stage.hidden { opacity:0; visibility:hidden; pointer-events:none; }
    #envelope-stage { transition:opacity .7s ease, visibility .7s ease; }
    #env { pointer-events:auto; }
    #env.opening { pointer-events:none; }

/* ---------- invitation stage ---------- */
    #invitation-stage {
      flex-direction: column;
      gap: 18px;
      opacity: 0;
      visibility: hidden;
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.8s ease 0.1s, visibility 0.8s;
      z-index: 20;
    }
    #invitation-stage.visible {
      opacity: 1;
      visibility: visible;
      position: fixed;
    }

    .card-frame {
      position: relative;
      width: min(94vw, 980px);
      aspect-ratio: 1280 / 853;
      margin: 0 auto;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 40px 90px -25px rgba(0,0,0,0.7), 0 10px 30px -10px rgba(0,0,0,0.5);
      opacity: 0;
      transform: translateY(26px) scale(0.97);
      transition: opacity 1s ease, transform 1s cubic-bezier(0.2, 0.7, 0.2, 1);
    }
    #invitation-stage.visible .card-frame {
      opacity: 1;
      transform: translateY(-35px) scale(1);
    }

    .invite-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .fx-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    /* sweep light */
    .sweep {
      position: absolute;
      top: -60%;
      left: -70%;
      width: 55%;
      height: 220%;
      background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,0.55) 50%, transparent 65%);
      mix-blend-mode: overlay;
      transform: translateX(0) rotate(8deg);
      opacity: 0;
    }
    .run .sweep {
      animation: sweep-move 1.5s ease-in-out 0.35s 1;
    }
    @keyframes sweep-move {
      0% { opacity: 0; transform: translateX(0) rotate(8deg); }
      12% { opacity: 1; }
      85% { opacity: 1; }
      100% { opacity: 0; transform: translateX(230%) rotate(8deg); }
    }

    /* gold blooms */
    .bloom {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(233,210,138,0.9) 0%, rgba(233,210,138,0) 70%);
      mix-blend-mode: screen;
      opacity: 0;
      filter: blur(2px);
    }
    .run .bloom { animation: bloom-in 2.2s ease-out forwards; }
    @keyframes bloom-in {
      0% { opacity: 0; transform: scale(0.7); }
      35% { opacity: 0.55; transform: scale(1.05); }
      65% { opacity: 0.28; transform: scale(1); }
      100% { opacity: 0.16; transform: scale(1); }
    }
    .b-title { left: 26%; top: 1%; width: 46%; height: 16%; animation-delay: 0.55s; }
    .b-fifty { left: 29%; top: 24%; width: 42%; height: 24%; animation-delay: 0.95s; }
    .b-spouse { left: 26%; top: 45%; width: 46%; height: 10%; animation-delay: 1.3s; }
    .b-signature { left: 33%; top: 84%; width: 32%; height: 11%; animation-delay: 2s; }
    .b-date { left: 78%; top: 5%; width: 20%; height: 12%; animation-delay: 1.15s; }
    .b-time { left: 78%; top: 22%; width: 16%; height: 10%; animation-delay: 1.35s; }
    .b-place { left: 76%; top: 35%; width: 22%; height: 14%; animation-delay: 1.55s; }
    .b-theme { left: 75%; top: 60%; width: 24%; height: 30%; animation-delay: 1.75s; }

    /* underlines (we removed the invitee underline) */
    .underline {
      position: absolute;
      height: 2px;
      background: linear-gradient(90deg, transparent, #e9d28a, #c9a227, #e9d28a, transparent);
      transform: scaleX(0);
      transform-origin: left center;
      opacity: 0;
      box-shadow: 0 0 6px rgba(233,210,138,0.6);
    }
    .run .underline { animation: draw-line 0.9s cubic-bezier(0.3, 0.7, 0.2, 1) forwards; }
    @keyframes draw-line {
      0% { opacity: 0; transform: scaleX(0); }
      10% { opacity: 1; }
      100% { opacity: 0.9; transform: scaleX(1); }
    }
    /* we keep spouse and signature underlines, but remove invitee */
    .u-spouse { left: 29%; width: 42%; top: 55.5%; animation-delay: 1.5s; }
    .u-signature { left: 36%; width: 26%; top: 93.5%; animation-delay: 2.35s; }

    /* sparkles */
    .spark {
      position: absolute;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #e9d28a;
      box-shadow: 0 0 8px 2px rgba(233,210,138,0.7);
      opacity: 0;
    }
    .run .spark { animation: spark-life 3.4s ease-in-out infinite; }
    @keyframes spark-life {
      0%, 100% { opacity: 0; transform: scale(0.4); }
      50% { opacity: 0.85; transform: scale(1); }
    }

    .caption-row {
      display: flex;
      justify-content: center;
      margin-top: 2px;
    }
    .replay-btn {
      background: none;
      border: none;
      color: rgba(248, 243, 230, 0.6);
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: clamp(13px, 1.6vw, 15px);
      letter-spacing: 0.03em;
      cursor: pointer;
      padding: 6px 10px;
      transition: color 0.3s ease;
    }
    .replay-btn:hover, .replay-btn:focus-visible { color: #e9d28a; }

    @media (max-width: 520px) {
      .stage { padding: 5vh 5vw; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.2s !important; }
    }
  
/* ═══ GUEST ADDRESS LABEL (above envelope) ═══ */
.guest-label {
  text-align: center;
  margin-bottom: clamp(18px, 4vh, 30px);
  position: relative;
  z-index: 2;
  opacity: 0;
  transform: translateY(-8px);
  animation: guestLabelIn 1.1s var(--ease-luxury) .25s forwards;
}
@keyframes guestLabelIn {
  to { opacity: 1; transform: translateY(0); }
}
.guest-label-sub {
  display: block;
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: clamp(13px, 1.7vw, 16px);
  letter-spacing: .04em;
  color: rgba(248, 243, 230, 0.55);
  margin-bottom: 6px;
}
.guest-name {
  display: block;
  font-family: 'Playfair Display', serif;
  font-weight: 700;
  font-size: clamp(1.15rem, 4vw, 1.65rem);
  letter-spacing: .01em;
  background: linear-gradient(110deg, #8f6b23, #e8cd8f 45%, #a88333 70%, #f0dca6);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 2px 10px rgba(122, 92, 31, .25));
}

/* ═══ CENTER INVITATION FRAME ═══ */
#invitation-stage{
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}
#invitation-stage .card-frame{
  margin-left:auto !important;
  margin-right:auto !important;
  left:auto !important;
  right:auto !important;
  transform-origin:center center;
}

</style>
</head>
<body>

<!-- BACKGROUND BUBBLES (champagne) -->
<div class="bubble-container" id="bubbleContainer"></div>

<!-- BACKGROUND TWINKLES -->
<div class="bg-flecks" id="bgFlecks"></div>

<!-- ENVELOPE STAGE -->
<div class="stage" id="envelope-stage">
<div id="env">
        <div class="guest-label">
            <span class="guest-label-sub">Cette invitation est adressée à</span>
            <span class="guest-name">M. et Mme. Bconcep</span>
        </div>
        <div class="env-wrap" id="envWrap" role="button" tabindex="0" aria-label="Open the invitation">
            <div class="env-body">
                <div class="env-flap" id="envFlap"></div>
                <div class="env-inner" id="envInner">
                    <div class="env-inner-content">
                        <span class="num">50</span>
                        <span class="tag">Surprise Party</span>
                    </div>
                </div>
            </div>
            <div class="env-seal" id="envSeal">50</div>
        </div>
        <p class="env-hint">Click to reveal the surprise</p>
    </div>

    
</div>

<!-- INVITATION STAGE -->
<div class="stage" id="invitation-stage">
  <div class="card-frame" id="cardFrame">
    <img class="invite-img" src="dad.jpg" alt="Invitation to my beloved husband's 50th birthday — Saturday, September 26, 2026, 7:00 PM, Akwa Palace Hotel, Douala. Chic and elegant theme, blue-grey and cream beige. Hadja Zenab.">
    <div class="fx-layer" id="fxLayer">
      <div class="sweep"></div>
      <div class="bloom b-title"></div>
      <div class="bloom b-fifty"></div>
      <div class="bloom b-spouse"></div>
      <div class="bloom b-signature"></div>
      <div class="bloom b-date"></div>
      <div class="bloom b-time"></div>
      <div class="bloom b-place"></div>
      <div class="bloom b-theme"></div>
      <!-- invitee underline removed -->
      <div class="underline u-spouse"></div>
    </div>
  </div>
  <div class="caption-row">
    <button class="replay-btn" id="replayBtn" type="button">↺ Replay the envelope</button>
  </div>
</div>

<script>
  // ---------- champagne bubbles (more, faster) ----------
  (function createBubbles() {
    const container = document.getElementById('bubbleContainer');
    const bubbleCount = 50; // increased
    for (let i = 0; i < bubbleCount; i++) {
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      const size = 10 + Math.random() * 28;
      bubble.style.width = size + 'px';
      bubble.style.height = size + 'px';
      bubble.style.left = (Math.random() * 100) + '%';
      // faster animation: 8-14s instead of 12-18s
      bubble.style.animationDuration = (8 + Math.random() * 8) + 's';
      bubble.style.animationDelay = (Math.random() * 15) + 's';
      bubble.style.opacity = 0.2 + Math.random() * 0.3;
      container.appendChild(bubble);
    }
  })();

  // ---------- background flecks ----------
  const flecks = document.getElementById('bgFlecks');
  for (let i = 0; i < 18; i++) {
    const s = document.createElement('span');
    s.style.left = (Math.random() * 100) + 'vw';
    s.style.top = (Math.random() * 100) + 'vh';
    s.style.animationDelay = (Math.random() * 5) + 's';
    s.style.animationDuration = (4 + Math.random() * 3) + 's';
    flecks.appendChild(s);
  }

  // ---------- sparkles inside the card ----------
  const fx = document.getElementById('fxLayer');
  const sparkSpots = [
    [18,58], [62,8], [70,18], [8,30], [45,12],
    [86,50], [55,80], [15,88], [80,85], [35,30]
  ];
  sparkSpots.forEach(([x, y], i) => {
    const sp = document.createElement('div');
    sp.className = 'spark';
    sp.style.left = x + '%';
    sp.style.top = y + '%';
    sp.style.animationDelay = (2.2 + i * 0.35) + 's';
    fx.appendChild(sp);
  });

  // ---------- envelope open / close ----------
  const envWrap = document.getElementById('envWrap');
  const envFlap = document.getElementById('envFlap');
  const envInner = document.getElementById('envInner');
  const envSeal = document.getElementById('envSeal');
  const envEl = document.getElementById('env');
  const envelopeStage = document.getElementById('envelope-stage');
  const invitationStage = document.getElementById('invitation-stage');
  const cardFrame = document.getElementById('cardFrame');
  const replayBtn = document.getElementById('replayBtn');

  let opened = false;

  function openEnvelope() {
    if (opened) return;
    opened = true;

    // A-style cinematic envelope sequence:
    // seal disappears -> flap opens -> letter rises -> envelope exits upward.
    envSeal.classList.add('hidden');
    setTimeout(() => envFlap.classList.add('open'), 180);
    setTimeout(() => envInner.classList.add('rising'), 650);
    setTimeout(() => {
      envEl.classList.add('opening');
      document.body.style.overflow = 'auto';
      envelopeStage.classList.add('hidden');
      invitationStage.classList.add('visible');
      setTimeout(() => cardFrame.classList.add('run'), 120);
    }, 1500);
    setTimeout(() => {
      envEl.classList.add('opened');
      envEl.style.display = 'none';
    }, 2350);
  }

  envWrap.addEventListener('click', openEnvelope);
  envWrap.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      openEnvelope();
    }
  });
  document.body.style.overflow = 'hidden';

  replayBtn.addEventListener('click', () => {
    opened = false;
    invitationStage.classList.remove('visible');
    cardFrame.classList.remove('run');
    envEl.style.display = 'flex';
    envEl.classList.remove('opened', 'opening');
    envFlap.classList.remove('open');
    envInner.classList.remove('rising');
    envSeal.classList.remove('hidden');
    envelopeStage.classList.remove('hidden');
    document.body.style.overflow = 'hidden';
  });
</script>
</body>
</html>
